services:
  db:
    image: postgres:17.6
    environment:
      POSTGRES_DB: gazi
      POSTGRES_USER: gazi
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD gerekli}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/001_install.sql:/docker-entrypoint-initdb.d/001_install.sql:ro
      - ./database/002_ingest.sql:/docker-entrypoint-initdb.d/002_ingest.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U gazi -d gazi']
      interval: 5s
      retries: 20
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://gazi:${DB_PASSWORD}@db:5432/gazi
    ports: ['127.0.0.1:8000:8000']
    depends_on:
      db: {condition: service_healthy}
  worker:
    build: .
    command: [python, -m, app.worker]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://gazi:${DB_PASSWORD}@db:5432/gazi
    depends_on:
      db: {condition: service_healthy}
volumes:
  pgdata:
